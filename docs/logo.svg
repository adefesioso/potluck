<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <title>Potluck</title>
  <!-- peers, meshed -->
  <g stroke="#8b8fa3" stroke-width="3" stroke-linecap="round">
    <line x1="34" y1="34" x2="80" y2="16"/>
    <line x1="80" y1="16" x2="126" y2="34"/>
    <line x1="34" y1="34" x2="126" y2="34"/>
  </g>
  <!-- steam rising from the pot to each peer -->
  <g fill="none" stroke="#04b8b8" stroke-width="5" stroke-linecap="round">
    <path d="M58 68 C 50 58, 42 50, 36 40"/>
    <path d="M80 68 C 74 56, 86 44, 80 24"/>
    <path d="M102 68 C 110 58, 118 50, 124 40"/>
  </g>
  <g fill="#04d7d7" stroke="#282a36" stroke-width="3">
    <circle cx="34" cy="34" r="10"/>
    <circle cx="80" cy="16" r="10"/>
    <circle cx="126" cy="34" r="10"/>
  </g>
  <!-- pot -->
  <rect x="10" y="88" width="20" height="10" rx="5" fill="#d9532f"/>
  <rect x="130" y="88" width="20" height="10" rx="5" fill="#d9532f"/>
  <path d="M28 82 H132 V112 C132 134 116 146 96 146 H64 C44 146 28 134 28 112 Z" fill="#ff7a59"/>
  <rect x="20" y="72" width="120" height="14" rx="7" fill="#d9532f"/>
  <path d="M44 100 V114 C44 124 50 130 58 132" fill="none" stroke="#ffb199" stroke-width="5" stroke-linecap="round"/>
</svg>
